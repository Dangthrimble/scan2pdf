name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package-version:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly
  PACKAGE_VERSION: ${{ inputs.package-version || format('ci-{0}', github.sha) }}
  PRODUCT: scan2pdf
  MODULE: github.com/Dangthrimble/scan2pdf
  BINARIES: scan2pdf

jobs:
  test:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-intel
            runner: macos-15-intel
          - platform: macos-apple-silicon
            runner: macos-15
          - platform: windows-x64
            runner: windows-2025
          - platform: windows-arm64
            runner: windows-11-arm
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go mod verify

      - name: Run tests
        if: matrix.platform == 'windows-arm64'
        run: go test -count=1 ./...

      - name: Run tests with race detector
        if: matrix.platform != 'windows-arm64'
        run: go test -race -count=1 ./...

      - run: go vet ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - run: go mod download
      - run: go mod verify

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - run: go vet ./...

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck
        run: |
          "$(go env GOPATH)/bin/staticcheck" ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0

      - name: Run govulncheck
        env:
          GODEBUG: netdns=cgo
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  runtime:
    name: Runtime (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-intel
            runner: macos-15-intel
            python-arch: x64
          - target: macos-apple-silicon
            runner: macos-15
            python-arch: arm64
          - target: windows-x64
            runner: windows-2025
            python-arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            python-arch: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            python-arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            python-arch: arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python-arch }}

      - run: python -m pip install -r scripts/requirements-runtime.txt
      - run: go mod download
      - run: go mod verify

      - name: Build release executable and package
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir -p dist/bin
          ext=""
          if [ "$(go env GOOS)" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-X ${MODULE}/internal/version.Version=${PACKAGE_VERSION}" -o "dist/bin/scan2pdf${ext}" ./cmd/scan2pdf
          go run ./cmd/buildpackage -binary "dist/bin/scan2pdf${ext}" -version "${PACKAGE_VERSION}" -out dist/packages

      - name: Verify packaged executable on native host
        run: |
          python scripts/verify_runtime.py --target "${{ matrix.target }}" \
            --archive "dist/packages/scan2pdf-${PACKAGE_VERSION}-${{ matrix.target }}.zip" \
            --version "$PACKAGE_VERSION" --commit "$GITHUB_SHA" \
            --output dist/runtime

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: github.event_name != 'pull_request'
        with:
          name: release-package-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: runtime-report-${{ matrix.target }}
          path: |
            dist/runtime/**/*.json
            dist/runtime/**/*.pdf
          if-no-files-found: warn

  gate:
    name: CI gate
    if: always()
    needs: [test, lint, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          for result in "${{ needs.test.result }}" "${{ needs.lint.result }}" "${{ needs.runtime.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
