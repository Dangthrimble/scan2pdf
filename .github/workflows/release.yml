name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-tag:
    name: Check tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

  validate:
    name: Validate release
    needs: check-tag
    uses: ./.github/workflows/ci.yml
    with:
      package-version: ${{ github.ref_name }}

  publish:
    name: Publish release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
      PRODUCT: scan2pdf
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-package-*
          merge-multiple: true

      - name: Verify all six packages
        run: |
          set -euo pipefail
          platforms=(macos-intel macos-apple-silicon windows-x64 windows-arm64 linux-x64 linux-arm64)
          for platform in "${platforms[@]}"; do
            archive="${PRODUCT}-${VERSION}-${platform}.zip"
            test -f "dist/${archive}"
            (cd dist && sha256sum -c "${archive}.sha256")
          done
          cat dist/*.zip.sha256 > dist/SHA256SUMS.txt
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" dist/*.zip dist/*.zip.sha256 dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            --title "$VERSION"
